  <nav>
    <div class="nav-container">

      <ul class="nav-links">

</button>

        <div class="hero-btns">

      </div>

            <model-viewer id="mainViewer" src="models/LetterName.glb" loading="lazy" auto-rotate camera-controls shadow-intensity="1" alt="3D model preview"></model-viewer>

          <button class="nav-btn-organic" id="nextModel" aria-label="Volgend 3D model"><i class="fas fa-chevron-right"></i></button>
